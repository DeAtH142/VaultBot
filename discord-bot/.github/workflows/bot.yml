# .github/workflows/bot.yml
# 🔐 Vault Bot — GitHub Actions'ta KESİNTİSİZ (blue-green) 7/24 çalıştırma
#
# Nasıl çalışır?
#   1. Bot oturumu Firestore'a sessionId/startedAt/status/lastHeartbeat yazar.
#   2. Bot her 30 sn'de heartbeat gönderir.
#   3. ~4.5 saat sonra bot KENDİNİ kapatır (SESSION_RUNTIME_MS) ve job biter.
#   4. restart job'ı hemen yeni bir oturum dispatch eder (zincir kopmaz).
#   5. Yeni oturum 'ready' olunca Firestore üzerinden eski oturuma
#      'draining' yazar — ama eski zaten kendini kapatmış olur (sıralı ve temiz).
#   6. Watchdog: herhangi bir sebeple oturum koparsa (crash, timeout, Actions
#      kesintisi) 15 dakikalık scheduled kontrol fark eder ve botu yeniden başlatır.
#
# Yani: sen hiçbir şey yapmazsın. Bot kendini sürekli yeniden başlatır.
#
# GEREKLİ SECRETS: DISCORD_TOKEN, FIREBASE_SERVICE_ACCOUNT (opsiyonel: ENCRYPTION_KEY)

name: Vault Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ne yapılsın?'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/bot.yml'
  # 🔒 Watchdog: her 15 dakikada oturum sağlığını kontrol et
  schedule:
    - cron: '*/15 * * * *'

# Aynı anda tek oturum: yenisi eskisi bitmeden başlamaz (SıRALI geçiş).
# Bot kendi kendini 4.5 saatte bir kapattığı için kesinti sadece
# job başlatma süresi (~1 dk) olur; watchdog kopmaları kurtarır.
concurrency:
  group: vault-bot
  cancel-in-progress: false

jobs:
  run-bot:
    # stop komutu veya watchdog'un "bot sağ" kararı durumunda çalışmaz
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330  # SESSION_RUNTIME_MS (4.5h) + grace
    steps:
      - name: ⬇️ Repo kopyala
        uses: actions/checkout@v4

      - name: 🟢 Node 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🔥 data/ klasörünü Firestore'dan indir
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cloud-sync.js pull

      - name: 🚀 Botu başlat (crash sonrası 30 sn bekleyip 3 kez tekrar dene)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUD_SYNC_INTERVAL_MS: '15000'
          SESSION_RUNTIME_MS: '16200000'   # 4.5 saat — sonra kontrollü kapanış
          HEARTBEAT_INTERVAL_MS: '30000'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "🚀 Başlatma denemesi $attempt/3"
            node src/index.js && break
            if [ "$attempt" -lt 3 ]; then
              echo "⚠️ Bot kapandı, 30 sn sonra tekrar denenecek..."
              sleep 30
            fi
          done
          exit 0

      - name: 🔥 data/ klasörünü Firestore'a yükle (kapanışta)
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cloud-sync.js push

  # ── Zincir başlatıcı: her oturum bitiminde yenisini tetikler ──────────────
  restart:
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'stop') }}
    needs: run-bot
    runs-on: ubuntu-latest
    steps:
      - name: ♻️ Yeniden başlatma workflow'u tetikle
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bot.yml',
              ref: context.ref,
              inputs: { action: 'start' }
            });

  # ── Watchdog: bot öldüyse (heartbeat yoksa) yeniden başlat ────────────────
  watchdog:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Repo kopyala
        uses: actions/checkout@v4

      - name: 🩺 Oturum sağlığı kontrolü
        id: health
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          RESULT=$(node scripts/session-watchdog.mjs 2>&1 | tail -1)
          echo "Sonuç: $RESULT"
          if [ "$RESULT" == "DEAD" ]; then
            echo "healthy=false" >> $GITHUB_OUTPUT
          else
            echo "healthy=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚑 Bot ölmüş — yeniden başlat
        if: ${{ steps.health.outputs.healthy == 'false' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bot.yml',
              ref: context.ref,
              inputs: { action: 'start' }
            });
