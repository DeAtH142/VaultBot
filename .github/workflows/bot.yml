name: VaultBot 7-24

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: vaultbot-run
  cancel-in-progress: true

jobs:
  vaultbot:
    runs-on: ubuntu-latest
    timeout-minutes: 280

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bagimliliklari kur
        working-directory: ./discord-bot
        run: npm install

      - name: .env olustur
        working-directory: ./discord-bot
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          EOF

      # 1. BOT BAŞLAMADAN ÖNCE VERİLERİ FIREBASE'DEN ÇEK
      - name: Firebase'den verileri cek (Pull)
        working-directory: ./discord-bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cloud-sync.js pull

      # 2. BOTU ÇALIŞTIR
      - name: Botu calistir
        working-directory: ./discord-bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: node src/index.js

      # 3. BOT KAPANDIKTAN SONRA VERİLERİ FIREBASE'E YÜKLE
      - name: Firebase'e verileri yukle (Push)
        if: always() # Bot hata verse bile verileri kaydetmeye çalış
        working-directory: ./discord-bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cloud-sync.js push