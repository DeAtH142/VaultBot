# .github/workflows/bot.yml
# 🔐 Vault Bot — GitHub Actions üzerinde 7/24 çalıştırma + elle aç/kapa kontrolü
#
# GitHub Actions'ın ücretsiz kotada dakika limiti vardır (public repo'da sınırsız,
# private repo'da ayda 2000 dakika). Kotayı aşmamak için bot 5 saatlik bloklar
# halinde çalışır ve her blok sonunda yeniden başlatılır. Bu sayede datanız
# Firestore'da kalıcıdır ve bot "uç kapanıp açma" senaryosunda kaldığı yerden
# devam eder (recovery + bulut senkronu).
#
# GEREKLİ GITHUB SECRETS (Repo > Settings > Secrets and variables > Actions):
#   DISCORD_TOKEN            -> bot ana tokeni
#   FIREBASE_SERVICE_ACCOUNT -> Service Account JSON'un TAMAMI (tek satır, string)
#
# Opsiyonel secrets:
#   ENCRYPTION_KEY           -> token şifreleme anahtarı (varsa)
#   DISCORD_TOKEN2..N        -> birden fazla token kullanılıyorsa

name: Vault Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ne yapılsın?'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/bot.yml'

concurrency:
  group: vault-bot
  cancel-in-progress: false

jobs:
  run-bot:
    # action=stop gönderilirse hiç çalıştırma
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 saat sonra job kendini bitirir; scheduler yeniden başlatır
    steps:
      - name: ☁️ Bot durdurma komutu kontrolü
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'stop' }}
        run: echo "Kullanıcı botu elle durdurdu. Job çalışmayacak."

      - name: ⬇️ Repo kopyala
        uses: actions/checkout@v4

      - name: 🟢 Node 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Bağımlılıkları kur
        run: npm ci

      - name: 🔥 data/ klasörünü Firestore'dan indir
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cloud-sync.js pull

      - name: 🚀 Botu başlat (crash sonrası 30 sn bekleyip 3 kez tekrar dene)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUD_SYNC_INTERVAL_MS: '15000'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "🚀 Başlatma denemesi $attempt/3"
            node src/index.js && break
            if [ "$attempt" -lt 3 ]; then
              echo "⚠️ Bot kapandı, 30 sn sonra tekrar denenecek..."
              sleep 30
            fi
          done
          # Son durum: buluta kesin yedek at (crash olsa bile veri kaybı olmasın)
          exit 0

      - name: 🔥 data/ klasörünü Firestore'a yükle (kapanışta)
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cloud-sync.js push

  # ── 5 saatlik blokları zincirleme başlatan scheduler ────────────────────────
  restart:
    # "stop" komutunda yeniden başlatma, aksi halde botu sonsuza dek tekrar başlat
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'stop') }}
    needs: run-bot
    runs-on: ubuntu-latest
    steps:
      - name: ♻️ Yeniden başlatma workflow'u tetikle
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bot.yml',
              ref: context.ref,
              inputs: { action: 'start' }
            });
