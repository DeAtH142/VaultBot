name: VaultBot 7-24

on:
  workflow_dispatch:

concurrency:
  group: vaultbot-run
  cancel-in-progress: true

jobs:
  vaultbot:
    runs-on: ubuntu-latest
    timeout-minutes: 280

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bagimliliklari kur
        working-directory: ./discord-bot
        run: npm install
      - name: .env olustur
        working-directory: ./discord-bot
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          EOF
      - name: Botu calistir
        working-directory: ./discord-bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: node src/index.js
      - name: Firebase'e verileri yukle (Push)
        if: always()
        working-directory: ./discord-bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cloud-sync.js push