name: VaultBot 7-24

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

# Ayni anda sadece 1 run - yenisi baslayinca eskisini iptal eder
concurrency:
  group: vaultbot-run
  cancel-in-progress: true

jobs:
  vaultbot:
    runs-on: ubuntu-latest
    timeout-minutes: 280

    steps:
      - uses: actions/checkout@v4

      # 1. CACHE
      - name: Data cache geri yukle
        uses: actions/cache@v4
        with:
          path: discord-bot/data
          key: vaultbot-data-${{ github.run_id }}
          restore-keys: |
            vaultbot-data-

      # 2. NODE KURULUMU
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. ANA BAGIMLILIKLAR
      - name: Bagimliliklari kur
        working-directory: ./discord-bot
        run: npm install

      # 4. .env DOSYASI
      - name: .env olustur
        working-directory: ./discord-bot
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF
          echo ".env dosyasi olusturuldu:"
          grep -o '^[A-Z_]*=' .env | tr -d '='

      # 5. BOTU CALISTIR
      - name: Botu calistir
        working-directory: ./discord-bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node src/index.js