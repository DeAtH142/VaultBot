name: bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: false
        default: "start"
  push:
    branches: [ main ]

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: discord-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cloud sync push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cloud-sync.js push