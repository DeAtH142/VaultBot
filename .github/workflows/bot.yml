name: VaultBot 7-24 Advanced

on:
  schedule:
    # 🚨 Her 4 saatte bir çalışır (0, 4, 8, 12...). 
    # 4 saat = 240 dakika. Timeout'u 230 yaparak çakışmayı önlüyoruz.
    - cron: '0 */4 * * *'
  workflow_dispatch:

# 🚨 CONCURRENCY KALDIRILDI: Eski iş bitmeden yeni iş gelirse GitHub'ın botu iptal etmesini önlüyoruz.
# Bu sayede bot asla boşta kalmaz.

jobs:
  vaultbot:
    runs-on: ubuntu-latest
    # 4 saatlik sürenin 10 dakika öncesinde kesiyoruz ki yenisi sorunsuz başlasın.
    timeout-minutes: 230 

    steps:
      - name: 📥 Kodu Çek
        uses: actions/checkout@v4

      - name: 🟢 Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🛠️ Sistem Araçlarını Kur (FFmpeg ve Zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg zip unzip

      - name: 📦 Bağımlılıkları Kur
        working-directory: ./discord-bot
        run: npm install

      - name: 📝 .env Dosyasını Oluştur
        working-directory: ./discord-bot
        run: |
          cat > .env <<'EOF'
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          ROLE_SERVER_ID=${{ secrets.ROLE_SERVER_ID }}
          ROLE_TIER_IDS=${{ secrets.ROLE_TIER_IDS }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY=${{ secrets.CLOUDFLARE_API_KEY }}
          TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          EOF

      - name: ☁️ Firebase'den Verileri Çek (Pull)
        working-directory: ./discord-bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cloud-sync.js pull

      - name: 🤖 Botu Çalıştır
        working-directory: ./discord-bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ROLE_SERVER_ID: ${{ secrets.ROLE_SERVER_ID }}
          ROLE_TIER_IDS: ${{ secrets.ROLE_TIER_IDS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node src/index.js

      - name: ☁️ Firebase'e Verileri Yükle (Push)
        if: always() # 🚨 Bot kapansa veya hata verse bile verileri (tokenler, süreler) mutlaka kaydet!
        working-directory: ./discord-bot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cloud-sync.js push
