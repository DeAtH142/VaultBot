# .github/workflows/terra.yml
# 🗺️ Terra Strateji Botu — GitHub Actions üzerinde 7/24 çalıştırma
#
# GEREKLİ GITHUB SECRETS (Repo > Settings > Secrets and variables > Actions):
#   TERRA_DISCORD_TOKEN       -> Terra botunun yeni tokeni (eski vault botundan farklı!)
#   TERRA_CLIENT_ID           -> Terra botunun Application (Client) ID'si
#   FIREBASE_SERVICE_ACCOUNT  -> Service Account JSON'un TAMAMI (tek satır, string)
#
# Not: Vault botu (bot.yml) ayrı çalışmaya devam eder; bu workflow Terra'yı yönetir.
# Her iki bot aynı Firestore projesini paylaşır ama koleksiyonları ayrıdır.

name: Terra Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ne yapılsın?'
        required: true
        default: 'start'
        type: choice
        options:
          - start
          - stop
  push:
    branches: [ main, master ]
    paths:
      - 'terra/src/**'
      - 'terra/package.json'
      - '.github/workflows/terra.yml'

concurrency:
  group: terra-bot
  cancel-in-progress: false

jobs:
  run-terra:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: terra
    steps:
      - name: ⬇️ Repo kopyala
        uses: actions/checkout@v4

      - name: 🟢 Node 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Bağımlılıkları kur
        run: npm install --no-fund --no-audit

      - name: 🔑 .env üret (GitHub Secrets'tan)
        env:
          TERRA_DISCORD_TOKEN: ${{ secrets.TERRA_DISCORD_TOKEN }}
          TERRA_CLIENT_ID: ${{ secrets.TERRA_CLIENT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cat > .env <<EOF
          DISCORD_TOKEN=$TERRA_DISCORD_TOKEN
          CLIENT_ID=$TERRA_CLIENT_ID
          FIREBASE_SERVICE_ACCOUNT=$FIREBASE_SERVICE_ACCOUNT
          EOF

      - name: 🚀 Terra botunu başlat (crash sonrası 30 sn bekleyip 3 kez tekrar)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "🚀 Başlatma denemesi $attempt/3"
            node src/index.js && break
            if [ "$attempt" -lt 3 ]; then
              echo "⚠️ Bot kapandı, 30 sn sonra tekrar denenecek..."
              sleep 30
            fi
          done
          exit 0

  # ── 5 saatlik blokları zincirleme başlatan scheduler ────────────────────────
  restart:
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'stop') }}
    needs: run-terra
    runs-on: ubuntu-latest
    steps:
      - name: ♻️ Yeniden başlatma workflow'u tetikle
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'terra.yml',
              ref: context.ref,
              inputs: { action: 'start' }
            });
